<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 420px;
            background-color: #0a0a0c;
            color: #00ff66;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            padding: 12px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #00ff6633;
        }
        .header img {
            width: 28px;
            height: 28px;
            border-radius: 4px;
        }
        .header h1 {
            font-size: 14px;
            letter-spacing: 1px;
            color: #00ff66;
            text-transform: uppercase;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 8px;
        }
        button {
            width: 100%;
            padding: 8px 12px;
            background: #141418;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.15s ease;
        }
        button:hover {
            background: #00ff66;
            color: #0a0a0c;
            box-shadow: 0 0 8px #00ff66aa;
        }
        button.btn-danger {
            color: #ff3366;
            border-color: #ff3366;
        }
        button.btn-danger:hover {
            background: #ff3366;
            color: #0a0a0c;
            box-shadow: 0 0 8px #ff3366aa;
        }
        textarea {
            width: 100%;
            height: 280px;
            background: #050507;
            color: #e0e0e0;
            border: 1px solid #1f2430;
            border-radius: 3px;
            padding: 10px;
            font-family: inherit;
            font-size: 11px;
            line-height: 1.4;
            resize: vertical;
            outline: none;
        }
        textarea:focus {
            border-color: #00ff66;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="icon.png" alt="Icon">
        <h1>Note81x :: Operational Filter</h1>
    </div>

    <div class="controls">
        <button id="scanBtn">Scan & Process Page</button>
        <div class="button-group">
            <button id="copyBtn">Copy to Obsidian</button>
            <button id="clearBtn" class="btn-danger">Clear Session</button>
        </div>
    </div>

    <textarea id="output" placeholder="Awaiting operational telemetry..."></textarea>

    <script src="popup.js"></script>
</body>
</html>
